# rtdetr-v-mamba.yaml
# RT-DETR-l architecture with transformer layers replaced by VSSMBlock (VMamba).
# - AIFI (transformer encoder on P5) → VSSMBlock
# - RepC3 FPN/PAN neck blocks → VSSMBlock
# - RTDETRDecoder detection head kept intact
#
# VSSMBlock args: [dim, d_state, ssm_ratio, d_conv]

nc: 80

backbone:
  # [from, repeats, module, args]
  - [-1, 1, HGStem, [32, 48]]                             # 0-P2/4
  - [-1, 6, HGBlock, [48, 128, 3]]                        # 1-stage1 (P2/4, 128ch)

  - [-1, 1, DWConv, [128, 3, 2, 1, False]]                # 2-P3/8
  - [-1, 6, HGBlock, [96, 512, 3]]                        # 3-stage2 (P3/8, 512ch)

  - [-1, 1, DWConv, [512, 3, 2, 1, False]]                # 4-P4/16
  - [-1, 6, HGBlock, [192, 1024, 5, True, False]]         # 5
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]          # 6
  - [-1, 6, HGBlock, [192, 1024, 5, True, True]]          # 7-stage3 (P4/16, 1024ch)

  - [-1, 1, DWConv, [1024, 3, 2, 1, False]]               # 8-P5/32
  - [-1, 6, HGBlock, [384, 2048, 5, True, False]]         # 9-stage4 (P5/32, 2048ch)

head:
  - [-1, 1, Conv, [256, 1, 1, None, 1, 1, False]]         # 10 input_proj.2
  # VSSMBlock replaces AIFI (the only transformer layer)
  - [-1, 1, VSSMBlock, [256, 16, 2.0, 3]]                 # 11 (was AIFI)
  - [-1, 1, Conv, [256, 1, 1]]                            # 12 Y5 lateral_convs.0

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 13
  - [7, 1, Conv, [256, 1, 1, None, 1, 1, False]]          # 14 input_proj.1 (1024→256)
  - [[-2, -1], 1, Concat, [1]]                            # 15 cat (512ch)
  - [-1, 3, RepC3, [256]]                                 # 16 fpn_blocks.0
  - [-1, 1, Conv, [256, 1, 1]]                            # 17 Y4 lateral_convs.1

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]            # 18
  - [3, 1, Conv, [256, 1, 1, None, 1, 1, False]]          # 19 input_proj.0 (512→256)
  - [[-2, -1], 1, Concat, [1]]                            # 20 cat backbone P3
  - [-1, 3, RepC3, [256]]                                 # 21 X3 fpn_blocks.1 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                            # 22 downsample_convs.0
  - [[-1, 17], 1, Concat, [1]]                            # 23 cat Y4
  - [-1, 3, RepC3, [256]]                                 # 24 F4 pan_blocks.0 (P4/16-medium)

  - [-1, 1, Conv, [256, 3, 2]]                            # 25 downsample_convs.1
  - [[-1, 12], 1, Concat, [1]]                            # 26 cat Y5
  - [-1, 3, RepC3, [256]]                                 # 27 F5 pan_blocks.1 (P5/32-large)

  - [[21, 24, 27], 1, RTDETRDecoder, [nc]]                # 28 RTDETRDecoder(P3, P4, P5)
