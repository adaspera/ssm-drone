# wang-yolo-mamba-attention.yaml

nc: 1
scales:  # [depth, width, max_channels]
  T: [0.33, 0.25, 1024]

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Wang2024SimpleStem, [128, 3]]         # 0-P2/4
  - [-1, 3, Wang2024VSSBlock, [128]]              # 1
  - [-1, 1, Wang2024VisionClueMerge, [256]]       # 2-P3/8
  - [-1, 3, Wang2024VSSBlock, [256]]              # 3
  - [-1, 1, Wang2024VisionClueMerge, [512]]       # 4-P4/16
  - [-1, 9, Wang2024VSSBlock, [512]]              # 5
  - [-1, 1, Wang2024VisionClueMerge, [1024]]      # 6-P5/32
  - [-1, 3, Wang2024VSSBlock, [1024]]             # 7
  - [-1, 1, SPPF, [1024, 5]]                      # 8
  
  - [-1, 1, C2PSA, [1024]] 

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 10
  - [[-1, 5], 1, Concat, [1]]                    # 11 - cat backbone P4
  - [-1, 3, Wang2024XSSBlock, [512]]             # 12

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 13
  - [[-1, 3], 1, Concat, [1]]                    # 14 - cat backbone P3
  - [-1, 3, Wang2024XSSBlock, [256]]             # 15 (P3/8-small)

  - [-1, 1, Conv, [256, 3, 2]]                   # 16
  - [[-1, 12], 1, Concat, [1]]                   # 17 - cat head P4
  - [-1, 3, Wang2024XSSBlock, [512]]             # 18 (P4/16-medium)

  - [-1, 1, Conv, [512, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                    # 20 - cat Mamba3 attention output
  - [-1, 3, Wang2024XSSBlock, [1024]]            # 21 (P5/32-large)

  - [[15, 18, 21], 1, Detect, [nc]]              # 22
