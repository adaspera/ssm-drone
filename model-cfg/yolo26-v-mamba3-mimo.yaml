# yolo26-v-mamba3-mimo.yaml
# Same structure as yolo26-v-mamba3.yaml but uses MIMO Mamba3 kernel
# VSSMBlock_Mamba3_MIMO args: [dim, d_state, ssm_ratio, d_conv, headdim, chunk_size, ngroups, mimo_rank]
# headdim=32 keeps smem under 99 KB optin limit on RTX 3070/5060Ti
# chunk_size=16 satisfies TileLang warp partition (m_warp*n_warp==4)
# ngroups=nheads (G==H) to satisfy MIMO backward kernel constraint (G==1 or G==H)

nc: 1
end2end: True
reg_max: 1

backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [16, 3, 2]]               # 0-P1/2
  - [-1, 1, Conv, [32, 3, 2]]               # 1-P2/4
  - [-1, 1, Conv, [64, 3, 2]]               # 2-P3/8

  # P3: d_inner=128, headdim=32 → nheads=4, ngroups=4 (G=K*ngroups=16=K*nheads=H ✓)
  - [-1, 1, VSSMBlock_Mamba3_MIMO, [64, 128, 2.0, 3, 32, 16, 4, 2]]   # 3-MIMO-VSS at P3/8

  - [-1, 1, Conv, [128, 3, 2]]              # 4-P4/16
  # P4: d_inner=256, headdim=32 → nheads=8, ngroups=8
  - [-1, 1, VSSMBlock_Mamba3_MIMO, [128, 128, 2.0, 3, 32, 16, 8, 2]]  # 5-MIMO-VSS at P4/16

  - [-1, 1, Conv, [256, 3, 2]]              # 6-P5/32
  # P5: d_inner=512, headdim=32 → nheads=16, ngroups=16
  - [-1, 1, VSSMBlock_Mamba3_MIMO, [256, 128, 2.0, 3, 32, 16, 16, 2]]  # 7-MIMO-VSS at P5/32

  - [-1, 1, SPPF, [256, 5, 3, True]]       # 8
  - [-1, 1, C2PSA, [256]]                  # 9

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 10
  - [[-1, 5], 1, Concat, [1]]                    # 11 - cat with P4
  - [-1, 1, C3k2, [128, True]]                   # 12
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]  # 13
  - [[-1, 3], 1, Concat, [1]]                    # 14 - cat with P3
  - [-1, 1, C3k2, [64, True]]                    # 15 (P3/8-small)
  - [-1, 1, Conv, [64, 3, 2]]                    # 16
  - [[-1, 12], 1, Concat, [1]]                   # 17 - cat with head 12
  - [-1, 1, C3k2, [128, True]]                   # 18 (P4/16-medium)
  - [-1, 1, Conv, [128, 3, 2]]                   # 19
  - [[-1, 9], 1, Concat, [1]]                    # 20 - cat with C2PSA
  - [-1, 1, C3k2, [256, True, 0.5, True]]        # 21 (P5/32-large)
  - [[15, 18, 21], 1, Detect, [nc]]              # 22
